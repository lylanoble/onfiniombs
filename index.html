<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Fullscreen App</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Fallback icons for iOS -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#ffffff">

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
            background-color: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Replace the src URL with your desired link -->
    <iframe src="https://script.google.com/macros/s/AKfycbwuHHEInXg6_NEW0eG789l0_JCPxyQPnKB0hxh4hcp9JDc3gAMSoBrcjD4PMPLcIAc8fw/exec" allow="fullscreen; autoplay; encrypted-media; geolocation"></iframe>

    <script>
        // Register Service Worker for PWA / installability
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.log('Service Worker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
